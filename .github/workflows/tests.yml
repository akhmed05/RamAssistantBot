name: Offline tests
on:
  pull_request:
  push:
    branches: [main, feat/ram-ai-readonly-mvp]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r RamAssistantBot/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
